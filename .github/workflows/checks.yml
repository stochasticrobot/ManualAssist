name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.15.0+cpu torchvision==0.29.2+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Check Python errors
        run: python -m ruff check backend examples --select E9,F63,F7,F82
      - name: Run offline tests
        run: python -m pytest -q
      - name: Rebuild the offline demonstration
        run: python examples/build_demo.py
